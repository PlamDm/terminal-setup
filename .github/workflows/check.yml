name: Check installers
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Offline installer, package, relocation and configuration fixtures
        run: python3 tests/check.py
      - name: Clean binary bootstrap, offline rerun and moved activation
        shell: bash
        run: |
          set -euo pipefail
          repository="$PWD"
          root="$PWD/.ci-playground/native"
          mkdir -p "$root"
          cd "$root"
          PATH=/usr/bin:/bin /bin/bash "$repository/install.sh"
          printf '\n# preserve bootstrap customization\n' >> config/yazi/yazi.toml
          PATH=/usr/bin:/bin /bin/bash ./install.sh --offline
          grep -q 'preserve bootstrap customization' config/yazi/yazi.toml
          cd ..
          mv native relocated
          cd relocated
          source ./activate.sh
          for command in bash git fzf yazi ya btop rustifiedgit codex copilot; do
            "./bin/$command" --version
          done
          ./bin/tmux -V
          ./bin/wezterm --version
          ./bin/code --version
          PATH=/usr/bin:/bin /bin/bash ./install.sh --offline --tools bash,tmux,fzf
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Safe offline package, MSYS2, selection and preservation fixtures
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = 'C:\Program Files\Git\bin;' + $env:PATH
          $env:TEMP = "$PWD\.ci-playground\fixture-tmp"
          $env:TMP = $env:TEMP
          [IO.Directory]::CreateDirectory($env:TEMP) | Out-Null
          foreach ($test in @('package-manager','msys2','codex-isolation','interactive','preserve-tools')) {
            & powershell.exe -NoProfile -File ".\tests\check-$test.ps1"
            if ($LASTEXITCODE) { throw "Failed fixture: $test" }
          }
      - name: Full OS-only bootstrap, offline rerun and relocation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $repository = $PWD.Path
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          $root = Join-Path $repository '.ci-playground\native'
          [IO.Directory]::CreateDirectory((Join-Path $root 'tmp')) | Out-Null
          $env:TEMP = Join-Path $root 'tmp'; $env:TMP = $env:TEMP
          Set-Location -LiteralPath $root
          & powershell.exe -NoProfile -NonInteractive -File (Join-Path $repository 'install.ps1')
          if ($LASTEXITCODE) { throw 'Full clean bootstrap failed.' }
          Add-Content config\yazi\yazi.toml '# preserve bootstrap customization'
          & powershell.exe -NoProfile -NonInteractive -File .\install.ps1 -Offline
          if ($LASTEXITCODE) { throw 'Full offline rerun failed.' }
          if (-not (Select-String -Quiet -Path config\yazi\yazi.toml -Pattern 'preserve bootstrap customization')) {
            throw 'Rerun replaced customized configuration.'
          }
          Set-Location -LiteralPath (Split-Path -Parent $root)
          $moved = Join-Path $PWD 'relocated'
          Move-Item -LiteralPath $root -Destination $moved
          Set-Location -LiteralPath $moved
          $env:TEMP = Join-Path $moved 'tmp'; $env:TMP = $env:TEMP
          . .\activate.ps1
          foreach ($command in @('bash','git','fzf','yazi','ya','rustifiedgit','codex','copilot','wezterm','btop','pwsh')) {
            & ".\bin\$command.cmd" --version
            if ($LASTEXITCODE) { throw "Relocated command failed: $command" }
          }
          & .\bin\tmux.cmd -V
          if ($LASTEXITCODE) { throw 'Relocated tmux failed.' }
          & .\bin\code.cmd --version
          if ($LASTEXITCODE) { throw 'Relocated VS Code failed.' }
          & powershell.exe -NoProfile -NonInteractive -File .\install.ps1 -Offline -Tools bash,tmux,fzf
          if ($LASTEXITCODE) { throw 'Relocated copied manager failed.' }
          if ([Environment]::GetEnvironmentVariable('Path', 'User') -cne $userPath -or
              [Environment]::GetEnvironmentVariable('Path', 'Machine') -cne $machinePath) {
            throw 'Bootstrap changed persistent PATH.'
          }
