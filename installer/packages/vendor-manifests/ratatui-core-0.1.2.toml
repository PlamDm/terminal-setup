[package]
name = "ratatui-core"
version = "0.1.2"
description = """
    Core types and traits for the Ratatui Terminal UI library.
    Widget libraries should use this crate. Applications should use the main Ratatui crate.
"""
documentation = "https://docs.rs/ratatui-core"
readme = "README.md"
repository = "https://github.com/ratatui/ratatui"
homepage = "https://ratatui.rs"
keywords = ["dashboard", "terminal", "tui"]
categories = ["command-line-interface"]
license = "MIT"
exclude = ["*.log", ".github", "CONTRIBUTING.md", "Makefile.toml", "assets/*", "tags"]
edition = "2024"
rust-version = "1.88.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.cargo-udeps.ignore]
normal = ["critical-section"]
development = ["critical-section"]

[features]
default = []

## enables std
std = [
  "bitflags/std",
  "compact_str/std",
  "itertools/use_std",
  "kasuari/std",
  "palette?/std",
  "serde?/std",
  "strum/std",
  "thiserror/std",
  "unicode-truncate/std",
]

## enables layout cache; uses thread_local when std is available,
## critical-section::Mutex otherwise (for no_std/embedded targets).
layout-cache = ["dep:critical-section"]

## enables conversions to / from colors, modifiers, and styles in the ['anstyle'] crate
anstyle = ["dep:anstyle"]

## enables conversions from colors in the [`palette`] crate to [`Color`](crate::style::Color).
palette = ["dep:palette"]

## enables portable-atomic integration for targets that don't support atomic types.
portable-atomic = ["kasuari/portable-atomic"]

## enables the backend code that sets the underline color. Underline color is only supported by
## the Crossterm backend, and is not supported on Windows 7.
underline-color = []

## Use terminal scrolling regions to make some operations less prone to
## flickering. (i.e. Terminal::insert_before).
scrolling-regions = []

## enables serialization and deserialization of style and color types using the [`serde`] crate.
## This is useful if you want to save themes to a file.
serde = ["bitflags/serde", "compact_str/serde", "dep:serde"]

[dependencies]
anstyle = { version = "1.0.3", optional = true }
bitflags = "2.9"
compact_str = { version = "0.10", default-features = false }
critical-section = { version = "1.2", optional = true }
document-features = { version = "0.2.11", optional = true }
hashbrown = "0.17"
itertools = { version = "0.15", default-features = false, features = ["use_alloc"] }
kasuari = { version = "0.4.9", default-features = false }
lru = "0.18"
palette = { version = "0.7.7", default-features = false, features = ["libm"], optional = true }
serde = { version = "1.0.219", default-features = false, features = ["derive"], optional = true }
strum = { version = "0.28", default-features = false, features = ["derive"] }
thiserror = { version = "2.0.12", default-features = false }
unicode-segmentation = "1.9"
unicode-truncate = { version = "2", default-features = false }
unicode-width = ">=0.2.0"

[dev-dependencies]
critical-section = { version = "1.2", features = ["std"] }
indoc = "2.0.5"
pretty_assertions = "1"
rstest = "0.26"
serde_json = "1.0.142"

[lints.rust]
unsafe_code = "forbid"


[lints.clippy]
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
pedantic = { level = "warn", priority = -1 }

# we often split up a module into multiple files with the main type in a file named after the
# module, so we want to allow this pattern
module_inception = "allow"

# nursery or restricted
as_underscore = "warn"
deref_by_slicing = "warn"
else_if_without_else = "warn"
empty_line_after_doc_comments = "warn"
equatable_if_let = "warn"
fn_to_numeric_cast_any = "warn"
format_push_string = "warn"
implicit_clone = "warn"
map_err_ignore = "warn"
missing_const_for_fn = "warn"
mixed_read_write_in_expression = "warn"
mod_module_files = "warn"
needless_pass_by_ref_mut = "warn"
needless_raw_strings = "warn"
or_fun_call = "warn"
redundant_type_annotations = "warn"
rest_pat_in_fully_bound_structs = "warn"
string_lit_chars_any = "warn"
string_slice = "warn"
unnecessary_self_imports = "warn"
use_self = "warn"

# Improve benchmark consistency
